<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cooldown Tracker</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <rect x="5" y="5" width="30" height="30" rx="8.125" fill="#111827" />
          <path d="M12.27 14.14C10 19.38 11.02 25.47 15.16 28.91C19.06 32.11 24.77 32.03 28.59 28.83C31.02 26.8 32.34 23.98 32.34 21.02" stroke="#f8fafc" stroke-width="2.97" stroke-linecap="round" />
          <path d="M17.5 14.69V21.72M22.97 14.69V21.72" stroke="#5eead4" stroke-width="2.81" stroke-linecap="round" />
          <circle cx="30.78" cy="16.02" r="2.89" fill="#f16468" />
        </svg>
      </div>
      <p id="eyebrow" class="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="description"></p>
      <p id="clock" class="clock" aria-live="polite">00:00:00</p>
      <div class="actions">
        <button type="button" id="back-button"></button>
        <a id="manage-link" href="index.html"></a>
      </div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
