<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cooldown Tracker</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="9" fill="#111827" />
          <path d="M13 13.5a10 10 0 1014 0" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
          <path d="M15.5 11.5v7M24.5 11.5v7" stroke="#5eead4" stroke-width="3" stroke-linecap="round" />
          <circle cx="29.5" cy="10.5" r="3.5" fill="#f16468" />
        </svg>
      </div>
      <p id="eyebrow" class="eyebrow"></p>
      <h1 id="title"></h1>
      <p id="description"></p>
      <p id="clock" class="clock" aria-live="polite">00:00:00</p>
      <div class="actions">
        <button type="button" id="back-button"></button>
        <a id="manage-link" href="index.html"></a>
      </div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
