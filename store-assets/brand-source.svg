<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>Cooldown Tracker</title>
  <desc>Temporizador en pausa con indicador de estado.</desc>

  <!-- El área visible mide 384 × 384 y deja el margen de 16 px recomendado
       por Chrome Web Store cuando se exporta a 128 × 128. -->
  <rect x="64" y="64" width="384" height="384" rx="104" fill="#111827"/>

  <!-- El arco abierto comunica espera sin parecer un botón de encendido. -->
  <path
    d="M157 181C128 248 141 326 194 370C244 411 317 410 366 369C397 343 414 307 414 269"
    stroke="#F8FAFC"
    stroke-width="38"
    stroke-linecap="round"
  />

  <!-- Pausa: formas anchas y separadas para conservarse a 16 px. -->
  <path d="M224 188V278M294 188V278" stroke="#5EEAD4" stroke-width="36" stroke-linecap="round"/>

  <!-- El punto completa visualmente el temporizador y aporta el estado activo. -->
  <circle cx="394" cy="205" r="37" fill="#F16468"/>
</svg>
