<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" fill="none">
  <defs>
    <linearGradient id="bg" x1="54" y1="46" x2="1334" y2="516" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17243A"/>
      <stop offset=".55" stop-color="#101A2D"/>
      <stop offset="1" stop-color="#0C1423"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientTransform="matrix(411 0 0 320 315 279)" gradientUnits="userSpaceOnUse">
